# Compose v2 (sin `version:`). Unico comando: docker compose up --build
# Healthchecks: sondeo cada pocos segundos solo durante start_period (start_interval),
# cada 30 s despues. Limites de memoria = techo con margen; el consumo real lo fijan
# los parametros de cada JVM / shared_buffers.
name: rickmorty

services:

  postgres:
    image: postgres:10.23-alpine
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "4432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: el servidor temporal de initdb solo escucha por socket unix
      # y daria un falso "ready" antes de que arranque el definitivo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 3s
    profiles:
      - infra
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  neo4j:
    image: neo4j:4.4.48-community
    environment:
      # NEO4J_AUTH solo se aplica en la primera inicializacion del volumen (cambiarla exige down -v).
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      # Heap fijo (initial = max) y page cache minimo: el grafo entero ocupa < 10 MB.
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 256m
      NEO4J_dbms_memory_pagecache_size: 64m
    ports:
      - "4575:7474"
      - "4788:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:7474 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
      start_interval: 5s
    stop_grace_period: 30s
    profiles:
      - infra
    deploy:
      resources:
        limits:
          memory: 640M
    restart: unless-stopped

  zookeeper:
    image: zookeeper:3.4.13
    environment:
      ZOO_MY_ID: "1"
      JVMFLAGS: "-Xms64m -Xmx128m -XX:+UseSerialGC"
    # Puerto 2181 no publicado: solo lo usa kafka dentro de la red de compose.
    volumes:
      - zk_data:/data
      - zk_datalog:/datalog
    healthcheck:
      # `srvr` esta siempre en la whitelist 4lw (lo usa zkServer.sh); `ruok` no lo garantiza.
      test: ["CMD-SHELL", "echo srvr | nc -w 2 127.0.0.1 2181 | grep -q Mode"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 3s
    profiles:
      - infra
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  kafka:
    image: wurstmeister/kafka:2.12-2.0.1
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Dos listeners: INTERNAL para contenedores (kafka:29092), EXTERNAL para el host
      # (localhost:9092), que permite ejecutar el backend fuera de Docker en desarrollo.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Un solo broker: RF 1 en los topics internos.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # Los topics (y sus .DLT) los declara la aplicacion con NewTopic (ADR-003).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: "24"
      # Ruta fija: el default de la imagen incluye el hostname del contenedor y cambia al recrearlo.
      KAFKA_LOG_DIRS: /kafka/kafka-logs
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    ports:
      - "4093:9092"
    volumes:
      - kafka_data:/kafka
    healthcheck:
      # kafka-topics --zookeeper NO comprueba el broker; broker-api-versions si (sale != 0 si no
      # responde). Es una JVM por sondeo: heap minimo y GC serial en el propio comando porque el
      # entorno del healthcheck hereda KAFKA_HEAP_OPTS del servicio.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xmx48m' KAFKA_JVM_PERFORMANCE_OPTS='-XX:+UseSerialGC -XX:TieredStopAtLevel=1' kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:29092 >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
      start_interval: 5s
    stop_grace_period: 30s
    profiles:
      - infra
    deploy:
      resources:
        limits:
          memory: 640M
    restart: unless-stopped

  backend:
    build: ./backend
    image: rickmorty-backend:dev
    # Imagen local, nunca en un registry: `up` siempre construye y no intenta hacer pull
    # (sin esto Compose prueba el pull primero y muestra 'pull access denied').
    pull_policy: build
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Si KafkaAdmin no puede crear los topics, el contenedor cae y `restart` reintenta,
      # en vez de arrancar sin topics con auto-create desactivado.
      SPRING_KAFKA_ADMIN_FAIL_FAST: "true"
      SERVER_TOMCAT_THREADS_MAX: "16"
      SYNC_ON_STARTUP: "false"
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS}
      # Swagger UI y /v3/api-docs desactivables en produccion (ADR-009).
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - "4080:8080"
    healthcheck:
      # curl viene en eclipse-temurin:*-jammy. -f falla con 503 (health DOWN).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
      start_interval: 5s
    profiles:
      - apps
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: rickmorty-frontend:dev
    pull_policy: build
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4300:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 2s
    profiles:
      - apps
    deploy:
      resources:
        limits:
          memory: 32M
    restart: unless-stopped

# Kafka y ZooKeeper se persisten juntos: si solo persistiera Kafka, tras `down`+`up` el broker
# arrancaria con logs que ZK no conoce. `docker compose down -v` deja estado limpio.
volumes:
  pg_data:
  neo4j_data:
  zk_data:
  zk_datalog:
  kafka_data:
