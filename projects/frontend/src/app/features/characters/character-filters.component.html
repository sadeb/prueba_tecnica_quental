<form class="filters card border-0 shadow-sm" role="search" aria-label="Filtros de personajes" (submit)="$event.preventDefault()">
  <div class="card-body">
    <div class="row g-3 align-items-end">
      <div class="col-12 col-md-6 col-lg-4">
        <label for="filter-name" class="form-label">Nombre</label>
        <div class="input-group">
          <span class="input-group-text" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          </span>
          <input
            id="filter-name"
            type="search"
            class="form-control"
            placeholder="Rick, Morty, Summer…"
            autocomplete="off"
            [formField]="form.name"
          />
        </div>
      </div>
      <div class="col-6 col-md-3 col-lg-2">
        <label for="filter-status" class="form-label">Estado</label>
        <select id="filter-status" class="form-select" [formField]="form.status">
          <option value="">Todos</option>
          @for (option of statusOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>
      <div class="col-6 col-md-3 col-lg-2">
        <label for="filter-gender" class="form-label">Género</label>
        <select id="filter-gender" class="form-select" [formField]="form.gender">
          <option value="">Todos</option>
          @for (option of genderOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>
      <div class="col-12 col-md-6 col-lg-3">
        <label for="filter-species" class="form-label">Especie</label>
        <input
          id="filter-species"
          type="search"
          class="form-control"
          placeholder="Human, Alien…"
          autocomplete="off"
          [formField]="form.species"
        />
        <div class="form-text">Coincidencia exacta, sin distinguir mayúsculas.</div>
      </div>
      <div class="col-12 col-md-6 col-lg-1 d-grid">
        <button type="button" class="btn btn-outline-secondary" (click)="reset()" [disabled]="!hasActive()">
          Limpiar
        </button>
      </div>
    </div>
  </div>
</form>
