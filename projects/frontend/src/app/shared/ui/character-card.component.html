<article class="card character-card h-100 shadow-sm border-0">
  <a [routerLink]="detailLink()" class="character-card-media" tabindex="-1" aria-hidden="true">
    <app-character-image [src]="character().imageUrl" [alt]="character().name" />
  </a>
  <div class="card-body d-flex flex-column gap-2">
    <div class="d-flex justify-content-between align-items-start gap-2">
      <h3 class="h6 card-title mb-0 text-truncate">
        <a [routerLink]="detailLink()" class="stretched-link text-body text-decoration-none">
          {{ character().name }}
        </a>
      </h3>
      @if (showFavorite()) {
        <div class="position-relative character-card-action">
          <app-favorite-toggle
            [active]="isFavorite()"
            [disabled]="favoritePending()"
            (toggle)="favoriteToggle.emit(character())"
          />
        </div>
      }
    </div>
    <app-status-badge [status]="character().status" />
    @if (subtitle()) {
      <p class="card-text small text-body-secondary mb-0 text-truncate" [title]="subtitle()">{{ subtitle() }}</p>
    }
    <p class="card-text small text-body-tertiary mb-0">
      <span class="visually-hidden">Género: </span>{{ gender() }}
    </p>
    @if (note()) {
      <p class="card-text small fw-medium text-primary mb-0 mt-auto">{{ note() }}</p>
    }
  </div>
</article>
