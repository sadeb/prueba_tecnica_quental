# Un solo worker para una SPA de demo (la imagen usa `auto` = 8-10 workers en un M-series).
worker_processes 1;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log notice;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # DNS embebido de Docker: resuelve `backend` por peticion (TTL 10 s). nginx arranca aunque
    # el backend no exista y sobrevive a que el backend se recree con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ^~ da prioridad sobre las locations regex (evita que /api/x.css caiga en estaticos).
        # Sin URI en proxy_pass se reenvia $request_uri intacto.
        location ^~ /api/ {
            set $backend http://backend:8080;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # index.html nunca se cachea: es el manifiesto de los bundles con hash.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # Bundles con hash (outputHashing=all): inmutables. Un chunk inexistente es 404, no index.html.
        location ~* \.(js|css|woff2)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA fallback para las rutas de Angular.
        location / {
            try_files $uri /index.html;
        }
    }
}
