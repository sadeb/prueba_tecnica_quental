databaseChangeLog:
  - changeSet:
      id: 001-domain-schema
      author: codex
      changes:
        - createTable:
            tableName: locations
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: source, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: external_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(255) }
              - column: { name: location_type, type: VARCHAR(255) }
              - column: { name: dimension, type: VARCHAR(255) }
              - column: { name: source_url, type: VARCHAR(512) }
              - column: { name: source_created_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: locations
            columnNames: source, external_id
            constraintName: uk_locations_source_external
        - createTable:
            tableName: episodes
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: source, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: external_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(255) }
              - column: { name: air_date, type: VARCHAR(64) }
              - column: { name: episode_code, type: VARCHAR(16) }
              - column: { name: source_url, type: VARCHAR(512) }
              - column: { name: source_created_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: episodes
            columnNames: source, external_id
            constraintName: uk_episodes_source_external
        - createTable:
            tableName: characters
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: source, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: external_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: species, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: character_type, type: VARCHAR(255) }
              - column: { name: gender, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: image_url, type: VARCHAR(512) }
              - column: { name: source_url, type: VARCHAR(512) }
              - column: { name: source_created_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: origin_location_id, type: BIGINT }
              - column: { name: current_location_id, type: BIGINT }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: characters
            columnNames: source, external_id
            constraintName: uk_characters_source_external
        - addForeignKeyConstraint:
            baseTableName: characters
            baseColumnNames: origin_location_id
            referencedTableName: locations
            referencedColumnNames: id
            constraintName: fk_characters_origin
        - addForeignKeyConstraint:
            baseTableName: characters
            baseColumnNames: current_location_id
            referencedTableName: locations
            referencedColumnNames: id
            constraintName: fk_characters_current_location
        - createTable:
            tableName: character_episodes
            columns:
              - column: { name: character_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: episode_id, type: BIGINT, constraints: { nullable: false } }
        - addPrimaryKey:
            tableName: character_episodes
            columnNames: character_id, episode_id
            constraintName: pk_character_episodes
        - addForeignKeyConstraint:
            baseTableName: character_episodes
            baseColumnNames: character_id
            referencedTableName: characters
            referencedColumnNames: id
            constraintName: fk_character_episodes_character
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: character_episodes
            baseColumnNames: episode_id
            referencedTableName: episodes
            referencedColumnNames: id
            constraintName: fk_character_episodes_episode
            onDelete: CASCADE
        - createTable:
            tableName: app_users
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: username, type: VARCHAR(80), constraints: { nullable: false, unique: true, uniqueConstraintName: uk_app_users_username } }
              - column: { name: password_hash, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: role, type: VARCHAR(16), constraints: { nullable: false } }
              - column: { name: enabled, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - createTable:
            tableName: user_favorites
            columns:
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: character_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addPrimaryKey:
            tableName: user_favorites
            columnNames: user_id, character_id
            constraintName: pk_user_favorites
        - addForeignKeyConstraint:
            baseTableName: user_favorites
            baseColumnNames: user_id
            referencedTableName: app_users
            referencedColumnNames: id
            constraintName: fk_favorites_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: user_favorites
            baseColumnNames: character_id
            referencedTableName: characters
            referencedColumnNames: id
            constraintName: fk_favorites_character
            onDelete: CASCADE
        - createTable:
            tableName: access_tokens
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: token_hash, type: VARCHAR(64), constraints: { nullable: false, unique: true, uniqueConstraintName: uk_access_tokens_hash } }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: expires_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: revoked_at, type: TIMESTAMP WITH TIME ZONE }
        - addForeignKeyConstraint:
            baseTableName: access_tokens
            baseColumnNames: user_id
            referencedTableName: app_users
            referencedColumnNames: id
            constraintName: fk_access_tokens_user
            onDelete: CASCADE
        - createIndex:
            tableName: characters
            indexName: idx_characters_filters
            columns:
              - column: { name: name }
              - column: { name: status }
              - column: { name: species }
              - column: { name: gender }
      rollback:
        - dropTable: { tableName: access_tokens }
        - dropTable: { tableName: user_favorites }
        - dropTable: { tableName: app_users }
        - dropTable: { tableName: character_episodes }
        - dropTable: { tableName: characters }
        - dropTable: { tableName: episodes }
        - dropTable: { tableName: locations }
